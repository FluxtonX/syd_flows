name: iOS Build & TestFlight

# ─────────────────────────────────────────────────────────
#  Trigger: jab bhi v*.*.* tag push karo (e.g. v1.0.1)
# ─────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Build Name (e.g. 1.0.12)'
        required: false
        default: '1.0.12'
      build_num:
        description: 'Build Number (e.g. 13)'
        required: false
        default: '13'

jobs:
  build-ios:
    name: Build & Upload to TestFlight
    runs-on: macos-latest

    steps:
      # ── 1. Code checkout ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Extract version from tag ───────────────────
      #    Handles: "v1.0.13", "v1.0.12+13", or workflow_dispatch
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_NAME="${{ github.event.inputs.build_name }}"
            BUILD_NUM="${{ github.event.inputs.build_num }}"
          else
            TAG="${{ github.ref_name }}"
            CLEAN_TAG="${TAG#v}"
            if echo "$CLEAN_TAG" | grep -q "+"; then
              BUILD_NAME="${CLEAN_TAG%+*}"
              BUILD_NUM="${CLEAN_TAG#*+}"
            else
              BUILD_NAME="$CLEAN_TAG"
              BUILD_NUM="${CLEAN_TAG##*.}"
            fi
          fi
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "Tag/Trigger: ${{ github.ref_name }} | Version: $BUILD_NAME | Build: $BUILD_NUM"

      # ── 3. Flutter setup ──────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      # ── 4. Install dependencies ───────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 5. Install CocoaPods ──────────────────────────
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      # ── 6. Import Apple Distribution Certificate ──────
      - name: Import distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # ── 7. Install Provisioning Profile ───────────────
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/profile.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" | grep -A1 UUID | grep string | sed -e 's/<[^>]*>//g' | tr -d ' \t')
          echo "Profile UUID: $PROFILE_UUID"
          cp "$PROFILES_DIR/profile.mobileprovision" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

      # ── 8. Build iOS IPA ──────────────────────────────
      - name: Build Flutter iOS (release)
        run: |
          flutter build ipa \
            --release \
            --build-name="${{ steps.version.outputs.BUILD_NAME }}" \
            --build-number="${{ steps.version.outputs.BUILD_NUM }}" \
            --export-options-plist=ios/ExportOptions.plist

      # ── 9. Upload IPA as GitHub artifact ─────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: syd-flow-${{ steps.version.outputs.BUILD_NAME }}.ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # ── 10. Upload to TestFlight ──────────────────────
      - name: Upload to TestFlight
        env:
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"
          if echo "$KEY_CONTENT" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$KEY_CONTENT" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          else
            echo "$KEY_CONTENT" | base64 --decode > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          fi
          cp "$HOME/private_keys/AuthKey_${KEY_ID}.p8" "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
          cp "$HOME/private_keys/AuthKey_${KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          echo "Found IPA: $IPA_FILE"
          
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --show-progress

      # ── 11. Cleanup keychain ──────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
